# ???? ???????
server.port=${SERVER_PORT:8081}

# ???????? ??????????
spring.application.name=${SPRING_APPLICATION_NAME:anda-fisher}

# ??????????? ? ????????? ???? (Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change_me}

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# API ???? ?????? (??? ????????? ???????)
weather.api.key=${WEATHER_API_KEY:your_openweathermap_api_key}

# JWT
jwt.secret=${JWT_SECRET:please_change_me}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# ????????? ????? (???????? ?????? ????????????, ???? ?????????? ????????)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:your_email@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your_app_password}
spring.mail.protocol=${SPRING_MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.debug=${SPRING_MAIL_DEBUG:false}

# Swagger ??????? ??? ???????
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
